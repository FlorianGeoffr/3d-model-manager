name: Release

# Automated semver releases (release-please, driven by Conventional Commits)
# plus container publishing to GHCR.
#
# Versioning contract:
#   * EVERY push to main publishes ghcr.io/metril/3d-model-manager:edge and
#     :sha-<short>, built from that exact tree, stamped APP_VERSION=edge-<sha>.
#   * Merging the release PR release-please maintains ADDITIONALLY cuts the
#     vX.Y.Z tag, writes CHANGELOG.md, publishes the full ladder
#     (:X.Y.Z, :X.Y, :X, :latest), stamps APP_VERSION=X.Y.Z, rebuilds the
#     browser-extension zip, and attaches it to the GitHub Release.
#
# release-please and the build run in the SAME workflow run, gated on
# release-please's `release_created` output. That is NOT a stylistic choice:
# refs pushed by GITHUB_TOKEN do not fire workflow events, so a separate
# `on: push: tags` workflow would never run for a release-please tag. The only
# alternatives are a PAT (banned by house convention) or a GitHub App. If this
# is ever "cleaned up" into two workflows, releases will silently stop
# publishing images while still creating tags -- the worst possible failure.
#
# Architecture: linux/amd64 only, for now. The build-by-digest + imagetools
# merge structure is kept even with a single-entry matrix so that re-enabling
# arm64 is a one-line uncomment -- see docs/arm64-status.md for exactly what
# blocks it (f3d, and only f3d, as of 2026-07).

on:
  push:
    branches: [main]

# Never cancel a release in flight -- a half-published manifest list, or a tag
# without an image, is far worse than a redundant run. (ci.yml uses
# cancel-in-progress: true; this deliberately does not.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/floriangeoffr/3d-model-manager
  UV_VERSION: "0.11.29"

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag, the CHANGELOG commit, the Release
      pull-requests: write   # open and keep updating the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Config lives in release-please-config.json +
          # .release-please-manifest.json at the repo root (default locations).

  # ---- Build -------------------------------------------------------------

  build:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve APP_VERSION
        id: appver
        run: |
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            echo "value=${{ needs.release-please.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.appver.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}
          cache-from: type=gha,scope=tdmm-amd64
          cache-to: type=gha,mode=max,scope=tdmm-amd64,ignore-error=true

  # ---- Release-only ------------------------------------------------------

  package-extension:
    name: Package browser extension
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify the manifest version matches the release
        # release-please rewrote extension/manifest.json's "version" via the json
        # extra-file, and this job checks out that very commit. A mismatch means
        # the extra-files wiring has silently stopped working -- fail loudly
        # rather than ship a zip whose internal version disagrees with its name.
        run: |
          manifest_version="$(jq -r .version extension/manifest.json)"
          expected="${{ needs.release-please.outputs.version }}"
          if [ "$manifest_version" != "$expected" ]; then
            echo "::error::extension/manifest.json says '$manifest_version' but the release is '$expected' -- check extra-files in release-please-config.json"
            exit 1
          fi
      - name: Build the zip
        # Ship exactly what Chrome loads: manifest.json + src/. NOT test/ (node
        # test suites the browser never sees), NOT README.md, NOT dist/ (the old
        # hand-built artifact -- git-ignored, and rebuilt right here). `cd
        # extension` roots the archive at manifest.json, so unzipping yields a
        # folder "Load unpacked" accepts directly. -X drops extra file
        # attributes for a more reproducible archive.
        run: |
          version="${{ needs.release-please.outputs.version }}"
          mkdir -p dist
          (cd extension && zip -r -X "../dist/tdmm-extension-${version}.zip" manifest.json src)
          (cd dist && sha256sum "tdmm-extension-${version}.zip" > "tdmm-extension-${version}.zip.sha256")
          unzip -l "dist/tdmm-extension-${version}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: |
            dist/tdmm-extension-*.zip
            dist/tdmm-extension-*.zip.sha256
          if-no-files-found: error

  release:
    name: Attach assets to the GitHub Release
    needs: [release-please, build, package-extension]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload assets to, and edit the body of, the Release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for release-note generation
      - uses: actions/download-artifact@v8
        with:
          # Filter explicitly -- build-push-action's *.dockerbuild artifacts have
          # no business on a Release, and downloading them has been flaky.
          pattern: extension-zip
          path: dist
          merge-multiple: true
      - name: Attach assets and deploy instructions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/tdmm-extension-*.zip
            dist/tdmm-extension-*.zip.sha256
          # DEVIATION, deliberate: no `generate_release_notes: true`, and
          # `append_body` instead of a replacing body. release-please already
          # created this Release with the CHANGELOG.md section as its body --
          # generated notes would duplicate it, and a plain `body:` would clobber
          # it. We append the operator-facing bits underneath.
          append_body: true
          body: |
            ## Container images

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```

            `linux/amd64`. One image serves every app service (`api`,
            `worker-io`, `worker-cpu`, `beat`, `printerd`) — they differ only by
            `ROLE`/`command`.

            ## Deploying

            ```bash
            IMAGE_TAG=${{ needs.release-please.outputs.tag_name }} \
              docker compose -f compose.yaml -f compose.prod.yaml pull
            IMAGE_TAG=${{ needs.release-please.outputs.tag_name }} \
              docker compose -f compose.yaml -f compose.prod.yaml up -d
            ```

            Confirm what's running:

            ```bash
            curl -s localhost:8080/api/health
            # {"status":"ok","version":"${{ needs.release-please.outputs.version }}"}
            ```

            ## Browser extension

            `tdmm-extension-${{ needs.release-please.outputs.version }}.zip` below
            is the sideload bundle. Verify, unzip, then `chrome://extensions` →
            **Developer mode** → **Load unpacked** → pick the unzipped folder.

            ```bash
            sha256sum -c tdmm-extension-${{ needs.release-please.outputs.version }}.zip.sha256
            ```
