# api + worker-io + worker-cpu + printerd (one shared image, docker/Dockerfile)
# + db + redis (SPEC "Architecture").
#
# Worker split (SPEC "Architecture"; M2 Task 10): `worker-io` runs
# `store_to_backend` and everything else that isn't a pipeline step;
# `worker-cpu` runs the CPU-heavy extraction/convert/render pipeline steps
# (`app.tasks.pipeline.*`, routed there by `celery_app.py`'s `task_routes`)
# with a memory-recycled process pool -- OCCT (STEP/IGES) and f3d can leak
# or balloon memory per-task, so each cpu worker child is recycled after 16
# tasks OR 1.5 GiB RSS, whichever comes first.
#
# PUID/PGID (Task 9): unset by default (containers run as root, unchanged
# M1 behavior). Set both in `.env` to have the entrypoint drop api/worker
# to that host uid/gid instead, so files written under the bind-mounted
# `./library` aren't root-owned -- see docker/entrypoint.sh.
#
# `beat` (Task 9, opt-in via `docker compose --profile beat up`): runs
# Celery beat for the optional scheduled scan -- only fires ticks once
# `TDMM_SCAN_INTERVAL_S` is also set to a positive number of seconds in
# `.env` (see `app.tasks.celery_app`'s conditional `beat_schedule`).
#
# `printerd` (M4, opt-in via `docker compose --profile printer up`): the
# Bambu LAN MQTT supervisor -- a plain `docker compose up` never starts it,
# and it idles harmlessly unless `TDMM_PRINTER_ENABLED=true` is also set in
# `.env` (see README "Printer integration").
#
# Watched-folder auto-import (Round 8 Task 5): `worker-io` always mounts
# `./slicer-watch` (override with `TDMM_SLICER_WATCH_HOST_DIR`) at `/watch`,
# but nothing polls it unless BOTH the `beat` profile is running AND
# `TDMM_SLICER_WATCH_INTERVAL_S` is set to a positive number of seconds in
# `.env` -- see `app.tasks.celery_app`'s conditional `beat_schedule`.
#
# Quickstart: `cp .env.example .env` then `docker compose up -d --build`.
# See README "Quickstart" for the first-run admin password note.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    ports:
      - "8080:8080"
    environment:
      TDMM_ROLE: api
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker-io:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      TDMM_ROLE: worker
      TDMM_QUEUES: io
      TDMM_CONCURRENCY: 2
      # Round 8 Task 5: the container-side path the watched-folder task
      # (`app.tasks.slicer_watch`, routed to the `io` queue this worker
      # consumes) polls. Only fires ticks once `TDMM_SLICER_WATCH_INTERVAL_S`
      # is also set in `.env` AND the `beat` profile is running.
      TDMM_SLICER_WATCH_DIR: /watch
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
      - ${TDMM_SLICER_WATCH_HOST_DIR:-./slicer-watch}:/watch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker-cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      TDMM_ROLE: worker
      TDMM_QUEUES: cpu
      # No TDMM_CONCURRENCY override here -- Celery defaults to one process
      # per CPU core, which is what CPU-bound extraction/convert/render work
      # wants. Recycled per-child (task count AND RSS) to contain OCCT/f3d
      # memory growth (SPEC "Architecture").
      TDMM_MAX_TASKS_PER_CHILD: 16
      TDMM_MAX_MEMORY_PER_CHILD_KB: 1572864
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Optional scheduled scan (SPEC "optional scheduled scan"; Task 9): a
  # plain `docker compose up` never starts this (profile-gated). Opt in
  # with `docker compose --profile beat up -d` AND set `TDMM_SCAN_INTERVAL_S`
  # in `.env` -- otherwise beat runs with an empty schedule and just idles.
  # Reuses the api/worker image + entrypoint: the entrypoint's explicit-
  # command passthrough (see docker/entrypoint.sh) execs this directly
  # instead of routing on TDMM_ROLE, so no migrations/uvicorn/worker startup
  # happen here.
  beat:
    profiles: ["beat"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # printerd (M4, opt-in via `docker compose --profile printer up`): the
  # long-lived Bambu MQTT supervisor (SPEC "Architecture"). A plain
  # `docker compose up` never starts it (profile-gated), and it idles
  # harmlessly unless TDMM_PRINTER_ENABLED=true is also set. Mirrors `beat`:
  # shares the app image + the entrypoint's explicit-command passthrough (no
  # TDMM_ROLE routing, no migrations/uvicorn), inherits PUID/PGID. Mounts
  # /data for the Fernet key ({data_dir}/secrets/printer.key) it needs to
  # decrypt access codes. No /library mount -- FTPS upload runs in worker-io.
  printerd:
    profiles: ["printer"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    command: ["python", "-m", "app.printerd"]
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Must match the credentials embedded in TDMM_DATABASE_URL in .env.
      POSTGRES_USER: tdmm
      POSTGRES_PASSWORD: tdmm
      POSTGRES_DB: tdmm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdmm -d tdmm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # `depends_on` only gates the initial `up` ordering, not what happens
    # after a host reboot: without an explicit restart policy, `db`/`redis`
    # don't come back on their own, but `api`/`worker` do (they have
    # `restart: unless-stopped`) and then crash-loop against a Postgres/Redis
    # that's simply never there.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  tdmm_data:
