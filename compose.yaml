# api + worker-io + worker-cpu (one shared image, docker/Dockerfile) + db +
# redis. `printerd` is M4 -- not added yet (SPEC "Architecture").
#
# Worker split (SPEC "Architecture"; M2 Task 10): `worker-io` runs
# `store_to_backend` and everything else that isn't a pipeline step;
# `worker-cpu` runs the CPU-heavy extraction/convert/render pipeline steps
# (`app.tasks.pipeline.*`, routed there by `celery_app.py`'s `task_routes`)
# with a memory-recycled process pool -- OCCT (STEP/IGES) and f3d can leak
# or balloon memory per-task, so each cpu worker child is recycled after 16
# tasks OR 1.5 GiB RSS, whichever comes first.
#
# Quickstart: `cp .env.example .env` then `docker compose up -d --build`.
# See README "Quickstart" for the first-run admin password note.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    ports:
      - "8080:8080"
    environment:
      TDMM_ROLE: api
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker-io:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      TDMM_ROLE: worker
      TDMM_QUEUES: io
      TDMM_CONCURRENCY: 2
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker-cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tdmm:local
    environment:
      TDMM_ROLE: worker
      TDMM_QUEUES: cpu
      # No TDMM_CONCURRENCY override here -- Celery defaults to one process
      # per CPU core, which is what CPU-bound extraction/convert/render work
      # wants. Recycled per-child (task count AND RSS) to contain OCCT/f3d
      # memory growth (SPEC "Architecture").
      TDMM_MAX_TASKS_PER_CHILD: 16
      TDMM_MAX_MEMORY_PER_CHILD_KB: 1572864
    env_file:
      - .env
    volumes:
      - tdmm_data:/data
      - ./library:/library
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 10 -d celery@$$HOSTNAME"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Must match the credentials embedded in TDMM_DATABASE_URL in .env.
      POSTGRES_USER: tdmm
      POSTGRES_PASSWORD: tdmm
      POSTGRES_DB: tdmm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdmm -d tdmm"]
      interval: 5s
      timeout: 5s
      retries: 10
    # `depends_on` only gates the initial `up` ordering, not what happens
    # after a host reboot: without an explicit restart policy, `db`/`redis`
    # don't come back on their own, but `api`/`worker` do (they have
    # `restart: unless-stopped`) and then crash-loop against a Postgres/Redis
    # that's simply never there.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  tdmm_data:
